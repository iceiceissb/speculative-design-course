<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a172a">
  <title>请等下一班 · 会协商的医院</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="brand"><h1>请等下一班</h1><span>会协商的医院</span></div>
    <div class="tools">
      <button id="sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6"/></svg><span>声音关闭</span></button>
      <button id="camera"><svg viewBox="0 0 24 24"><path d="m12 2 10 5v10l-10 5L2 17V7l10-5Zm0 0v20M2 7l10 5 10-5"/></svg><span>全景视角</span></button>
      <button id="restart"><svg viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 8M20 2v5h-5"/></svg><span>重新开始</span></button>
    </div>
  </header>
  <main>
    <section class="theatre" aria-label="可旋转的医院三维场景">
      <canvas id="world" tabindex="0" aria-label="3D 场景。拖动旋转，滚轮缩放。也可用全景视角按钮切换镜头。"></canvas>
      <div id="scene-caption" class="scene-caption">林岚复诊结束，想去七楼花园见朋友。</div>
      <div id="speaker-bubble" class="speaker-bubble" aria-hidden="true"></div>
      <div class="playback"><button id="pause" disabled aria-label="暂停动画"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span>暂停</span></button><button id="skip" hidden>看本幕结果</button><span id="motion-label">拖动旋转 · 滚轮缩放</span></div>
      <div id="webgl-error" hidden><h2>这个浏览器未能启动 3D</h2><p>请用 Edge 或 Chrome 打开本文件，并启用浏览器的图形加速。</p><button onclick="location.reload()">重新加载</button></div>
    </section>
    <aside class="narrative" aria-label="故事与选择">
      <div id="narrative-content" aria-live="polite">
        <p id="chapter-count" class="chapter-count">01 / 06</p>
        <h2 id="heading">影子先到</h2>
        <p id="description">林岚还没到，电梯里已经亮起了她的位置。</p>
        <div class="dialogue"><span class="dash"></span><p id="dialogue">小椅：我先替您占一小块光。</p></div>
        <div id="actions" class="actions"></div>
        <p id="reflection" class="reflection" hidden></p>
      </div>
      <div class="panel-bottom"><button id="replay" hidden>重试本幕</button><span>设计虚构 · 选择只留在本次体验</span></div>
    </aside>
  </main>
  <nav id="chapters" class="chapters" aria-label="故事章节"></nav>
  <script src="three.min.js"></script><script src="texture.js"></script><script src="actors.js"></script><script src="story.js"></script><script src="stage.js"></script><script src="app.js"></script>
</body>
</html>
